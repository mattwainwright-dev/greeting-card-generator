<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title> Greeting Card Generator</title>

        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.1.1/css/pico.classless.min.css"/>
        <link rel="stylesheet" href="style.css" />   

    </head>
    <body>
        <header>
            <img class="pulse-logo" src="pulse-hero-transparent-fixed.png" alt="Pulse logo" />
            <h1>Greeting Card Generator</h1>
        </header>

        <main>
            <section id="order-section">
                <h2>Order a card</h2>

                <label>
                    A name
                    <input id="name-input" type="text" />
                </label>

                <label>
                    An adjective
                    <input id="adjective-input" type="text" />
                </label>

                <label>
                    A noun
                    <input id="noun-input" type="text" />
                </label>

                <button id="make-button" type="button">Make my card</button>
            </section>

            <section id="card-section" hidden>
                <article>
                    <p id="bonus-line" hidden>You found your hidden Pulse. 🤘🫶 </p>
                    <p id="card-text">Your card will appear here.</p>
                    <p id="closing-text"></p>
                </article>

                <button type="button" id="surprise-button">Surprise me</button>
                <button type="button" id="reset-button">Reset</button>
            </section>
        </main>

        <footer>
            <p>Created by Matthew Wainwright, 2026.</p>
        </footer>

        <script src="card.js"></script>
    </body>
</html>
